name: dart test

on:
  push:
    branches: [main]
    tags-ignore: ["*-v*"]
    paths:
      - "dart/**"
  pull_request:
    branches: [main]
    paths:
      - "dart/**"

jobs:
  test:
    name: Dart ${{ matrix.version }}

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["3.6.0"]

    defaults:
      run:
        working-directory: dart

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.version }}

      - name: Download pub dependencies
        run: dart pub get --no-example

      - name: Run analyzer
        run: dart analyze

      - name: Run tests
        run: dart test

      - name: Dry run pub publish
        # We don't want it to fail the CI, it's just to see how would `pub publish` behave.
        run: dart pub publish --dry-run || true

  web-platform:
    name: Web platform selection

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: dart

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.6.0"

      - name: Download pub dependencies
        run: dart pub get --no-example

      - name: Check the WebSocket transport on dart2js
        run: dart test -p chrome test/signalr_core/web_socket_channel_platform_test.dart

      - name: Check the WebSocket transport on dart2wasm
        run: dart test -p chrome --compiler dart2wasm test/signalr_core/web_socket_channel_platform_test.dart
